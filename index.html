<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2b3a" />
    <title>Idle Driver</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Idle Driver</h1>
        <p class="sub">You are the autopilot. Get the family to the mountains, live on stream.</p>
      </header>

      <section class="topbar">
        <div><span class="label">Cash</span><span id="cash" class="value">$0</span><span id="rate" class="unit"></span></div>
        <div><span class="label"><span class="live">● LIVE</span> Viewers</span><span id="viewers" class="value">0</span></div>
        <div><span class="label">Gas ⛽</span><div class="gauge"><div id="gas"></div></div><span id="gas-text" class="unit"></span></div>
      </section>

      <div id="view" class="view" aria-label="The family SUV on the highway">
        <div id="place" class="place"></div>
        <div id="autonomy" class="autonomy"></div>
        <div id="speedo" class="speedo"></div>
        <div id="status" class="status" hidden></div>
        <button id="takeover" class="takeover" hidden>
          <span class="what"></span><span class="ask"></span><span class="timer-bar"><span class="timer"></span></span>
        </button>
        <button id="crash" class="takeover crash" hidden>
          <span class="what"></span><span class="ask"></span><span class="timer-bar"><span class="timer"></span></span>
        </button>
      </div>

      <section class="trip">
        <div class="bar"><div id="progress"></div></div>
        <p id="landmark"></p>
        <p id="next" class="muted"></p>
      </section>

      <section class="dad">
        <span id="dad-face" class="face">😀</span>
        <div class="dad-meter"><span class="label">Dad's tiredness</span><div class="bar"><div id="tired"></div></div></div>
      </section>

      <div class="actions">
        <button id="honk" class="honk">Honk 📯<span class="small">chat loves it</span></button>
        <button id="coffee" class="honk coffee">☕ Coffee<span id="coffee-cost" class="small"></span></button>
      </div>

      <nav class="tabs" role="tablist">
        <button id="tab-car" class="tab" role="tab" aria-selected="true">🚙 Car</button>
        <button id="tab-stream" class="tab" role="tab" aria-selected="false">📱 Stream</button>
      </nav>
      <section id="upgrades-car" class="upgrades"></section>
      <section id="upgrades-stream" class="upgrades" hidden></section>

      <dialog id="away" class="away">
        <h2>While you were away</h2>
        <ul id="away-list"></ul>
        <p id="away-stop"></p>
        <form method="dialog"><button class="honk">Back on the road</button></form>
      </dialog>

      <footer>
        <span id="build" class="muted"></span>
        <span class="muted credits">Map © OpenStreetMap contributors, OpenFreeMap · terrain AWS/USGS · land cover USGS NLCD</span>
        <button id="reset" class="link">Reset trip</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
